name: Deploy website

on:
  push:
    branches: [main, preview]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Cache optimized images
        uses: actions/cache@v6
        with:
          path: |
            public/nextImageExportOptimizer
            public/images/**/nextImageExportOptimizer
            public/images/next-image-export-optimizer-hashes.json
          key: images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}-${{ hashFiles('assets/images/**', 'app/**', 'constants/image.constants.ts', 'public/data/**', 'public/images/**', '!public/images/**/nextImageExportOptimizer/**', '!public/images/next-image-export-optimizer-hashes.json') }}
          restore-keys: |
            images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}-
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd013c51283357e627ba2b4cc7284369
          WRANGLER_SEND_METRICS: "false"
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$DEPLOY_BRANCH" = "main" ]; then
            npx wrangler deploy
          fi
          npx wrangler preview --name preview
